spring.application.name=eds-middleware
server.port=8080

# Base URL for downstream eds-server
eds.server.base-url=http://localhost:8081
management.endpoints.web.exposure.include=health,info

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8085/realms/eds
security.oauth2.client-id=eds-middleware
security.cors.enabled=true
